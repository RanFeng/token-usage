<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Token Usage</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<script src="/preload.js"></script>
<style>
  :root {

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
