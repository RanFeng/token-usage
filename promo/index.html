<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>Token Usage · Antigravity 全景 Token 透视引擎</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/scenes-a.css" />
  <link rel="stylesheet" href="styles/scenes-b.css" />
</head>
<body>
  <main id="promo-root" class="promo-root">
    <canvas id="bg-canvas" class="promo-bg-canvas" width="1920" height="1080"></canvas>

    <div id="stage" class="promo-stage" aria-label="Promo Stage"></div>

    <div id="hud" class="promo-hud" aria-hidden="true">
      <div class="hud-reticle hud-tl"></div>
      <div class="hud-reticle hud-tr"></div>
      <div class="hud-reticle hud-bl"></div>
      <div class="hud-reticle hud-br"></div>

      <div id="hud-scene-tag" class="hud-scene-tag">
        <span id="hud-tag-dot" class="hud-tag-dot"></span>
        <span id="hud-scene-label" class="hud-tag-text">00 / IGNITION</span>
      </div>

      <div id="hud-timecode" class="hud-timecode tabular-nums">00:00:00 · 60FPS</div>

      <div class="hud-progress-wrap">
        <div class="hud-progress-track">
          <div id="hud-progress-fill" class="hud-progress-fill"></div>
          <div id="hud-progress-head" class="hud-progress-head"></div>
        </div>
        <div class="hud-progress-ticks">
          <span class="hud-tick" style="left: 12.5%"></span>
          <span class="hud-tick" style="left: 29.1667%"></span>
          <span class="hud-tick" style="left: 45.8333%"></span>
          <span class="hud-tick" style="left: 62.5%"></span>
          <span class="hud-tick" style="left: 75%"></span>
          <span class="hud-tick" style="left: 87.5%"></span>
        </div>
      </div>

      <div id="hud-grain" class="hud-film-grain"></div>
    </div>
  </main>

  <script src="js/timeline.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/backdrop.js"></script>
  <script src="js/scene1_hook.js"></script>
  <script src="js/scene2_live.js"></script>
  <script src="js/scene3_overview.js"></script>
  <script src="js/scene4_security.js"></script>
  <script src="js/scene5_radar.js"></script>
  <script src="js/scene6_share.js"></script>
  <script src="js/scene7_outro.js"></script>
</body>
</html>
