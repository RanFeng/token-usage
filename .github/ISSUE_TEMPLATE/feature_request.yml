name: Feature Request
description: Suggest a new feature, chart, export format, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make **Token Usage** better? For open-ended discussions or roadmap voting, feel free to use [GitHub Discussions](https://github.com/RanFeng/token-usage/discussions) as well!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this feature solve, or what workflow would it improve?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Alignment Check
      options:
        - label: This feature can work 100% locally without external dependencies or uploading user transcripts.
